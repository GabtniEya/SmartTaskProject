
services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - database
      - ai-service

  ai-service:
    build: ./ai-service
    expose:
      - "8001"

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: smarttask
      POSTGRES_USER: smarttask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
